
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Contacto Samuel Diaz</title>
    <link rel="icon" type="image/x-icon" href="imagenes/favicon.ico">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #243247;
            background: #f3f6fa;
        }

        header,
        nav,
        main,
        footer {
            max-width: 1000px;
            margin: auto;
        }

        header {
            padding: 30px 24px;
            background: #17365d;
            color: white;
        }

        nav {
            padding: 14px 24px;
            background: #244d78;
        }

        nav a {
            color: white;
            margin-right: 22px;
            font-weight: bold;
        }

        main {
            padding: 24px;
        }

        section {
            background: white;
            padding: 22px;
            margin: 18px 0;
            border-radius: 10px;
        }

        fieldset {
            border: 1px solid #ccd5df;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccd5df;
            border-radius: 5px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        input[type="submit"],
        input[type="reset"] {
            width: auto;
            padding: 12px 20px;
            background: #244d78;
            color: white;
            cursor: pointer;
            margin-right: 10px;
        }

        footer {
            padding: 20px 24px;
            text-align: center;
            color: #526174;
        }
    </style>
</head>

<body>

    <header>
        <h1>Contacto profesional</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="aficiones.html">Aficiones</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main>

        <section>
            <h2>Formulario de contacto</h2>

            <p>Si estás interesado en mi perfil profesional, puedes contactar conmigo mediante este formulario.</p>

            <form>

                <!-- Datos personales -->
                <fieldset>

                    <legend>Datos de contacto</legend>

                    <label for="nombre">Nombre y apellidos:</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required>

                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">

                    <label for="fecha">Fecha de disponibilidad:</label>
                    <input type="date" id="fecha" name="fecha">

                    <label for="cv">Adjuntar CV en PDF:</label>
                    <input type="file" id="cv" name="cv" accept=".pdf">

                </fieldset>

                <!-- Motivo del contacto -->
                <fieldset>

                    <legend>Motivo del contacto</legend>

                    <label for="motivo">Selecciona el motivo:</label>

                    <select id="motivo" name="motivo">
                        <option>Oferta de prácticas</option>
                        <option>Oferta de empleo</option>
                        <option>Solicitud de información</option>
                        <option>Entrevista</option>
                        <option>Otros motivos</option>
                    </select>

                    <label for="area">Área profesional de interés:</label>

                    <input list="areas" id="area" name="area">

                    <datalist id="areas">
                        <option value="Administración de sistemas">
                        <option value="Redes informáticas">
                        <option value="Desarrollo web">
                        <option value="Ciberseguridad">
                        <option value="Soporte técnico">
                    </datalist>

                    <p>Medio de contacto preferido:</p>

                    <label>
                        <input type="radio" name="contacto" value="correo">
                        Correo electrónico
                    </label>

                    <label>
                        <input type="radio" name="contacto" value="telefono">
                        Teléfono
                    </label>

                    <label>
                        <input type="checkbox" name="autorizacion" required>
                        Autorizo que se utilicen mis datos para responder a esta solicitud.
                    </label>

                    <label for="mensaje">Mensaje:</label>

                    <textarea id="mensaje" name="mensaje" rows="5"></textarea>

                </fieldset>

                <input type="submit" value="Enviar">
                <input type="reset" value="Limpiar">

            </form>

        </section>

    </main>

    <footer>
        <p>Contacto de Samuel Diaz</p>

        <a href="index.html">Volver al CV</a> |
        <a href="aficiones.html">Volver a aficiones</a>
    </footer>

</body>
</html>
